# === Layer 1: Block tunnel egress domain direct access ===
server {
    listen 80;
    listen [::]:80;
    server_name aion2.cfb27.com;
    return 403;
}

# === Layer 2: Main service (reverse proxy to vinext dev) ===
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Root path redirect to English homepage
    location = / {
        return 301 https://$host/en/;
    }

    location = /health {
        return 200 "ok\n";
    }

    # vinext dev source path assets: no edge cache
    location ^~ /app/ {
        proxy_pass http://app:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /@vite/ {
        proxy_pass http://app:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=60" always;
    }

    location ^~ /node_modules/ {
        proxy_pass http://app:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=60" always;
    }

    location ~* \.(webp|avif|png|jpg|jpeg|gif|svg|ico|css|js|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        proxy_pass http://app:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://app:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
