# AION2-KINA nginx — Dokploy deployment
# Acts as reverse proxy between Traefik and app container
# Adds security headers for sprite files (MapLibre GL JS markers)

server {
    listen 80;
    server_name _;

    # Proxy all requests to app container
    location / {
        proxy_pass http://app:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sprite files — add security headers for MapLibre GL JS WebGL texture loading
    location /sprites/ {
        proxy_pass http://app:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Required for MapLibre GL JS to use sprite PNG as WebGL texture
        add_header cross-origin-resource-policy "same-origin" always;
        add_header x-content-type-options "nosniff" always;
        
        # Cache sprites for 1 day
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    }
}
