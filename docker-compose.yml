services:
  app:
    build:
      context: ./app
    restart: unless-stopped
    env_file: .env
    volumes:
      - wrangler-state:/app/dist/server/.wrangler/state/v3
      - app-data:/app/data
    mem_limit: 3g
    memswap_limit: 4g
    networks:
      - dokploy-network

  nginx:
    build:
      context: ./nginx
    restart: unless-stopped
    ports:
      - "7777:80"
    depends_on:
      - app
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aion2-kina.rule=Host(`aion2-kina.2-25-206-13.sslip.io`) || Host(`kina.aion2kina.com`)"
      - "traefik.http.routers.aion2-kina.entrypoints=websecure"
      - "traefik.http.routers.aion2-kina.tls.certresolver=letsencrypt"
      - "traefik.http.routers.aion2-kina-http.rule=Host(`aion2-kina.2-25-206-13.sslip.io`) || Host(`kina.aion2kina.com`)"
      - "traefik.http.routers.aion2-kina-http.entrypoints=web"
      - "traefik.http.routers.aion2-kina-http.middlewares=redirect-to-https@docker"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.services.aion2-kina.loadbalancer.server.port=80"

volumes:
  wrangler-state:
    driver: local
  app-data:
    driver: local

networks:
  dokploy-network:
    external: true
